<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172030">
<title>Muster</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, phone-first. Summary (month heatmap) above detail (day list). Gold = threshold met. */
:root{
  --bg:#edf0f4; --surface:#ffffff; --ink:#17202d; --muted:#5b6677; --line:#d3d9e2;
  --accent:#1d5b86; --accent-ink:#ffffff; --gold:#b9840f; --gold-soft:#f7e9c4; --gold-ink:#5a3f00;
  --display:'Cinzel', 'Trajan Pro', Georgia, serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141e; --surface:#162030; --ink:#e5eaf2; --muted:#93a0b3; --line:#29364a;
    --accent:#5ea8dc; --accent-ink:#071320; --gold:#e6b544; --gold-soft:#372c10; --gold-ink:#f5d78a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141e; --surface:#162030; --ink:#e5eaf2; --muted:#93a0b3; --line:#29364a;
  --accent:#5ea8dc; --accent-ink:#071320; --gold:#e6b544; --gold-soft:#372c10; --gold-ink:#f5d78a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 64px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand h1{font-family:var(--display);font-size:1.6rem;letter-spacing:.04em;margin:0;line-height:1.1}
.brand span{font-size:.82rem;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.who select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.pill{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill.host{border-color:var(--accent);color:var(--accent)}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:.9rem}
.note.warn{border-left-color:var(--gold)}
h2{font-family:var(--display);font-size:1.05rem;letter-spacing:.05em;margin:4px 0 0;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.calcard{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.calcard:hover{border-color:var(--accent)}
.calcard .t{font-family:var(--display);font-weight:700;font-size:1.1rem}
.meta{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.next{font-size:.9rem;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.star{color:var(--gold);font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);flex:1;min-width:120px}
.field input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:#b4372b;border-color:#e2b1aa}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);font-weight:600}
.topbar{display:flex;align-items:center;gap:10px}
.topbar h2{margin:0;font-size:1.25rem;flex:1}
details.settings summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.settings summary::after{content:"▾";color:var(--muted)}
details.settings[open] summary::after{content:"▴"}
.settings .inner{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.stepper button{border:none;background:var(--bg);width:38px;height:38px;font-size:1.1rem}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.invite{display:flex;gap:8px}
.invite input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.8rem;color:var(--muted)}
.members{display:flex;flex-direction:column;gap:6px}
.member{display:flex;justify-content:space-between;align-items:center;font-size:.92rem;padding:4px 0;border-bottom:1px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line)}
.legend .lh{background:var(--gold);border-color:var(--gold)}
.legend .ls{background:var(--gold-soft);border:1.5px dashed var(--gold)}
.legend .ly{background:var(--accent);border-color:var(--accent)}
.legend .lm{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,transparent 3px 6px);border-color:var(--accent)}
.monthnav{display:flex;align-items:center;justify-content:space-between}
.monthnav strong{font-family:var(--display);letter-spacing:.04em}
.monthnav button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid .dow{font-size:.7rem;text-align:center;color:var(--muted);font-weight:600}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 3px 4px;display:flex;flex-direction:column;gap:2px;min-height:46px;text-align:left}
.cell.past{opacity:.35}
.cell.today{border-color:var(--accent)}
.cell .n{font-size:.72rem;font-weight:600;font-variant-numeric:tabular-nums}
.cell .bar{height:6px;border-radius:2px;background:color-mix(in srgb,var(--accent) var(--f,0%),var(--bg))}
.cell .bar.hit{background:var(--gold)}
.cell .bar.soft{background:var(--gold-soft);outline:1px dashed var(--gold);outline-offset:-1px}
.toggle{display:flex;align-items:center;gap:8px;font-size:.9rem}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:12px}
.day.hit{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.dayhead{display:flex;align-items:center;gap:8px}
.dayhead .d{font-weight:700}
.dayhead .d small{font-weight:500;color:var(--muted);margin-left:4px}
.badge{font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--gold);color:#1d1503}
.badge.soft{background:var(--gold-soft);color:var(--gold-ink);border:1px dashed var(--gold)}
.dayhead .linkbtn{margin-left:auto;font-size:.82rem}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{position:relative;border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 6px 6px;display:flex;flex-direction:column;gap:1px;text-align:left;min-height:58px}
.chip .s{font-size:.8rem;font-weight:700}
.chip .c{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip .me{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.chip.mine-y{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.mine-y .c{color:inherit;opacity:.85}
.chip.mine-m{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--bg)) 0 6px,var(--bg) 6px 12px);border-color:var(--accent);border-style:dashed}
.chip.st-hit{box-shadow:0 0 0 2px var(--gold)}
.chip.st-soft{box-shadow:0 0 0 2px var(--gold-soft),0 0 0 3px var(--gold)}
.chip.st-hit::after,.chip.st-soft::after{content:"★";position:absolute;top:4px;right:6px;font-size:.75rem;color:var(--gold)}
.chip.st-soft::after{content:"☆"}
.chip:disabled{cursor:default}
.whopanel{font-size:.84rem;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.whopanel b{font-weight:700}
.whopanel .none{color:var(--muted)}
.empty{color:var(--muted);font-size:.92rem;text-align:center;padding:18px 8px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
/* ===== config: paste your project's anon / publishable key below ===== */
const SUPABASE_URL = 'https://bikypwnzfjanlrmeysgz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZsoQStMOlKiJItbnhvEwlw_bbuEeUuO';
/* ===================================================================== */

const SLOTS = [['b','Brunch'],['a','Afternoon'],['e','Evening']];
const SLOTNAME = {b:'Brunch',a:'Afternoon',e:'Evening'};
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY = ymd(new Date());
const THIS_MONTH = TODAY.slice(0,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
function addMonth(ym,k){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+k,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function monthDays(ym){ const [y,m]=ym.split('-').map(Number); const n=new Date(y,m,0).getDate(); const out=[]; for(let d=1;d<=n;d++) out.push(ym+'-'+pad(d)); return out; }
function fmtDay(s){ const d=toDate(s); return DOW[d.getDay()]+', '+MON[d.getMonth()].slice(0,3)+' '+d.getDate(); }
function fmtKey(k){ const [d,s]=k.split('|'); return fmtDay(d)+' · '+SLOTNAME[s]; }
const here = () => location.origin + location.pathname;
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
const errText = e => (e && (e.message || e.error_description)) || String(e);

const configured = !SUPABASE_KEY.startsWith('PASTE');
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }) : null;

const S = {
  phase:'boot', me:null, isAnon:false, email:'',
  cals:{}, members:{}, av:{},
  screen:'home', calId:null, month:THIS_MONTH, onlyHits:false, open:{},
  invite:null, notes:{}, confirm:null, settingsOpen:false,
  authOpen:false, sentTo:'', busy:false,
};
const pend = {};       // "cid|day|slot" -> 'y' | 'm' | null, my unsaved taps
const calDirty = {};   // cid -> true while a settings change is unsaved

/* ---------- derived ---------- */
const membersOf = cid => (S.members[cid] || []).map(m => m.uid);
const nameOf = (cid,u) => { const m=(S.members[cid]||[]).find(x=>x.uid===u); return (m && m.name) || 'Player'; };
const myStatus = (cid,key) => S.av[cid]?.[S.me]?.[key];
function tally(cid,key){ const y=[],m=[]; for (const u of membersOf(cid)){ const v=S.av[cid]?.[u]?.[key]; if(v==='y') y.push(u); else if(v==='m') m.push(u); } return {y,m}; }
function statusOf(cid,t){ const thr=S.cals[cid].threshold; if(t.y.length>=thr) return 'hit'; if(t.y.length+t.m.length>=thr) return 'soft'; return ''; }
const isHostOf = cid => S.cals[cid] && S.cals[cid].host_id === S.me;
const sortCals = ids => ids.sort((a,b)=> S.cals[a].created_at < S.cals[b].created_at ? -1 : 1);
function upcoming(cid){
  const keys=new Set(); for (const u in (S.av[cid]||{})) for (const k in S.av[cid][u]) keys.add(k);
  const hit=[],soft=[];
  for (const k of keys){ if(k.slice(0,10)<TODAY) continue; const t=tally(cid,k), s=statusOf(cid,t); if(s==='hit') hit.push([k,t]); else if(s==='soft') soft.push([k,t]); }
  const ord=k=>k.slice(0,10)+'bae'.indexOf(k.slice(11)); const by=(a,b)=>ord(a[0])<ord(b[0])?-1:1;
  return {hit:hit.sort(by), soft:soft.sort(by)};
}
function myName(){ const saved=lsGet('muster-name'); if (saved) return saved; for (const cid in S.members){ const m=S.members[cid].find(x=>x.uid===S.me); if(m) return m.name; } return ''; }

/* ---------- loading ---------- */
async function loadAll(){
  const [c,m] = await Promise.all([
    sb.from('calendars').select('id,name,threshold,host_id,invite_code,created_at'),
    sb.from('members').select('calendar_id,user_id,display_name'),
  ]);
  if (c.error) throw c.error; if (m.error) throw m.error;
  const rows=[];
  for (let from=0; ; from+=1000){
    const r = await sb.from('availability').select('calendar_id,user_id,day,slot,status').gte('day',TODAY)
      .order('calendar_id').order('user_id').order('day').order('slot').range(from, from+999);
    if (r.error) throw r.error; rows.push(...r.data); if (r.data.length < 1000) break;
  }
  const cals={}; for (const x of c.data) cals[x.id] = calDirty[x.id] && S.cals[x.id] ? S.cals[x.id] : x;
  const members={}; for (const x of m.data) (members[x.calendar_id] ||= []).push({uid:x.user_id, name:x.display_name});
  const av={}; for (const x of rows){ ((av[x.calendar_id] ||= {})[x.user_id] ||= {})[x.day+'|'+x.slot] = x.status; }
  for (const id in pend){ const [cid,day,slot]=id.split('|'); const mine=((av[cid] ||= {})[S.me] ||= {}); if (pend[id]) mine[day+'|'+slot]=pend[id]; else delete mine[day+'|'+slot]; }
  S.cals=cals; S.members=members; S.av=av;
  if (S.screen==='cal' && !S.cals[S.calId]) S.screen='home';
}
let refreshTimer=null;
function refreshSoon(){ clearTimeout(refreshTimer); refreshTimer=setTimeout(()=>loadAll().then(()=>{ delete S.notes.load; render(); }).catch(e=>{ S.notes.load='Couldn’t refresh: '+errText(e); render(); }), 400); }
let channel=null;
function subscribe(){
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('muster-'+S.me)
    .on('postgres_changes',{event:'*',schema:'public',table:'availability'},refreshSoon)
    .on('postgres_changes',{event:'*',schema:'public',table:'members'},refreshSoon)
    .on('postgres_changes',{event:'*',schema:'public',table:'calendars'},refreshSoon)
    .subscribe();
}
document.addEventListener('visibilitychange',()=>{ if (document.visibilityState==='visible' && S.phase==='ready') refreshSoon(); });

/* ---------- auth ---------- */
async function applySession(sess){
  const uid = sess?.user?.id || null;
  const anon = !!sess?.user?.is_anonymous;
  if (S.phase!=='boot' && uid===S.me && anon===S.isAnon) return;
  S.me=uid; S.isAnon=anon; S.email=sess?.user?.email||'';
  S.cals={}; S.members={}; S.av={};
  if (!uid){
    if (channel){ sb.removeChannel(channel); channel=null; }
    if (S.invite) return guestSignIn();
    S.phase='signedout'; render(); return;
  }
  S.phase='loading'; render();
  try { await loadAll(); subscribe(); } catch(e){ S.notes.load='Couldn’t load your calendars: '+errText(e); }
  S.phase='ready';
  await checkInvite(); render();
}
async function guestSignIn(){
  S.phase='loading'; render();
  const r=await sb.auth.signInAnonymously();   // onAuthStateChange picks up the new guest session
  if (r.error){ S.phase='signedout'; S.notes.auth='Couldn’t open the invite: '+errText(r.error); render(); }
}
async function sendLink(){
  const box=document.getElementById('email'); const email=(box.value||'').trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ box.focus(); S.notes.auth='Enter a valid email address.'; render(); return; }
  S.busy=true; delete S.notes.auth; render();
  let r;
  if (S.isAnon){
    // Keeps this guest's games: the email gets attached to the same player.
    r = await sb.auth.updateUser({email}, {emailRedirectTo: here()});
    if (r.error) r = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: here()}});
  } else {
    r = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: here()}});
  }
  S.busy=false;
  if (r.error) S.notes.auth='Couldn’t send the link: '+errText(r.error);
  else { S.sentTo=email; S.authOpen=false; }
  render();
}

/* ---------- invites ---------- */
function readHash(){
  const h=(location.hash||'').slice(1);
  if (/^join-[a-f0-9]{6,32}$/.test(h)) S.invite={code:h.slice(5), state:'checking', info:null};
}
function clearHash(){ try { history.replaceState(null,'',location.pathname+location.search); } catch(e){} }
async function checkInvite(){
  if (!S.invite || !S.me) return;
  const code=S.invite.code;
  const already=Object.keys(S.cals).find(id=>S.cals[id].invite_code===code && (isHostOf(id) || membersOf(id).includes(S.me)));
  if (already){ S.invite=null; clearHash(); openCal(already); return; }
  const r=await sb.rpc('invite_info',{p_code:code});
  if (r.error || !r.data || !r.data.length) S.invite={code, state:'bad', info:null};
  else S.invite={code, state:'ok', info:r.data[0]};
}
async function joinFromInvite(){
  const box=document.getElementById('joinName'); const name=(box.value||'').trim();
  if (!name){ box.focus(); return; }
  S.busy=true; render();
  const r=await sb.rpc('join_calendar',{p_code:S.invite.code, p_display_name:name});
  S.busy=false;
  if (r.error){ S.notes.join='Couldn’t join: '+errText(r.error); render(); return; }
  lsSet('muster-name',name); S.invite=null; clearHash();
  try { await loadAll(); } catch(e){}
  openCal(r.data); render(); window.scrollTo(0,0);
}

/* ---------- writes ---------- */
const wq={};
function cycle(key){
  const cid=S.calId; if (key.slice(0,10)<TODAY) return;
  const mine=((S.av[cid] ||= {})[S.me] ||= {}); const v=mine[key];
  const next = !v ? 'y' : v==='y' ? 'm' : null;
  if (next) mine[key]=next; else delete mine[key];
  const id=cid+'|'+key; pend[id]=next;
  const e = wq[id] || (wq[id]={busy:false,dirty:false,t:null});
  e.dirty=true; clearTimeout(e.t); e.t=setTimeout(()=>flushAv(id),350);
  render();
}
async function flushAv(id){
  const e=wq[id]; if (e.busy || !e.dirty) return;
  e.dirty=false; e.busy=true;
  const [cid,day,slot]=id.split('|'); const val=pend[id];
  try {
    const r = val
      ? await sb.from('availability').upsert({calendar_id:cid,user_id:S.me,day,slot,status:val,updated_at:new Date().toISOString()})
      : await sb.from('availability').delete().match({calendar_id:cid,user_id:S.me,day,slot});
    if (r.error) throw r.error;
  } catch(err){ S.notes.write='A change didn’t save ('+errText(err)+'). Tap it again.'; delete pend[id]; refreshSoon(); render(); }
  finally { e.busy=false; if (e.dirty) flushAv(id); else delete pend[id]; }
}
const calTimers={};
function saveCal(cid){
  calDirty[cid]=true; clearTimeout(calTimers[cid]);
  calTimers[cid]=setTimeout(async()=>{
    const c=S.cals[cid]; if(!c) return;
    const r=await sb.from('calendars').update({name:c.name, threshold:c.threshold}).eq('id',cid);
    delete calDirty[cid];
    if (r.error){ S.notes.write='Settings didn’t save: '+errText(r.error); refreshSoon(); render(); }
  },400);
}
async function createCal(){
  const nameEl=document.getElementById('newName'), thrEl=document.getElementById('newThr'), meEl=document.getElementById('hostName');
  const name=nameEl.value.trim(), thr=Math.max(1,Math.min(40,parseInt(thrEl.value,10)||1)), dn=(meEl.value||'').trim();
  if (!name){ nameEl.focus(); return; } if (!dn){ meEl.focus(); return; }
  S.busy=true; render();
  const r=await sb.rpc('create_calendar',{p_name:name,p_threshold:thr,p_display_name:dn});
  S.busy=false;
  if (r.error){ S.notes.write='Couldn’t create the calendar: '+errText(r.error); render(); return; }
  lsSet('muster-name',dn);
  try { await loadAll(); } catch(e){}
  openCal(r.data); S.settingsOpen=true; render(); window.scrollTo(0,0);
}
async function simple(promise, what){ const r=await promise; if (r.error){ S.notes.write=what+': '+errText(r.error); render(); return false; } return true; }

/* ---------- events ---------- */
function openCal(id){ S.screen='cal'; S.calId=id; S.month=THIS_MONTH; S.open={}; S.confirm=null; S.settingsOpen=false; }
const app=document.getElementById('app');
app.addEventListener('click', async ev => {
  const b=ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a=b.dataset.act, cid=S.calId;
  if (a==='open'){ openCal(b.dataset.id); render(); window.scrollTo(0,0); }
  else if (a==='home'){ S.screen='home'; render(); window.scrollTo(0,0); }
  else if (a==='cycle') cycle(b.dataset.key);
  else if (a==='who'){ S.open[b.dataset.date]=!S.open[b.dataset.date]; render(); }
  else if (a==='month'){ S.month=addMonth(S.month,+b.dataset.k); render(); }
  else if (a==='jump'){ const el=document.getElementById('d-'+b.dataset.date); if (el) el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); }
  else if (a==='create') createCal();
  else if (a==='join') joinFromInvite();
  else if (a==='send') sendLink();
  else if (a==='authOpen'){ S.authOpen=!S.authOpen; render(); }
  else if (a==='signout'){ await sb.auth.signOut(); }
  else if (a==='thr'){ const c=S.cals[cid]; c.threshold=Math.max(1,Math.min(40,c.threshold+(+b.dataset.k))); saveCal(cid); render(); }
  else if (a==='copy'){ const link=here()+'#join-'+S.cals[cid].invite_code; try { await navigator.clipboard.writeText(link); b.textContent='Copied'; } catch(e){ document.getElementById('inviteBox').select(); b.textContent='Select & copy'; } }
  else if (a==='remove'){
    const u=b.dataset.u; if (S.confirm!=='rm-'+u){ S.confirm='rm-'+u; render(); return; }
    S.confirm=null; if (await simple(sb.from('members').delete().match({calendar_id:cid,user_id:u}),'Couldn’t remove that player')) refreshSoon();
  }
  else if (a==='del'){
    if (S.confirm!=='del'){ S.confirm='del'; render(); return; }
    if (await simple(sb.from('calendars').delete().eq('id',cid),'Couldn’t delete the calendar')){ S.screen='home'; await loadAll().catch(()=>{}); render(); }
  }
  else if (a==='leave'){
    if (S.confirm!=='leave'){ S.confirm='leave'; render(); return; }
    if (await simple(sb.from('members').delete().match({calendar_id:cid,user_id:S.me}),'Couldn’t leave this game')){ S.screen='home'; await loadAll().catch(()=>{}); render(); }
  }
  else if (a==='dismiss'){ if (b.dataset.k==='_sent') S.sentTo=''; else delete S.notes[b.dataset.k]; render(); }
});
app.addEventListener('change', ev => {
  const t=ev.target;
  if (t.id==='onlyHits'){ S.onlyHits=t.checked; render(); }
  else if (t.id==='rename'){ const v=t.value.trim(); if (v && S.cals[S.calId]){ S.cals[S.calId].name=v.slice(0,80); saveCal(S.calId); } render(); }
});
app.addEventListener('toggle', ev => { if (ev.target.classList && ev.target.classList.contains('settings')) S.settingsOpen=ev.target.open; }, true);
app.addEventListener('keydown', ev => {
  if (ev.key!=='Enter') return; const id=ev.target.id;
  if (id==='newName'||id==='newThr'||id==='hostName') createCal();
  else if (id==='joinName') joinFromInvite();
  else if (id==='email') sendLink();
});
app.addEventListener('focusout', () => { if (renderWaiting) setTimeout(render,0); });
window.addEventListener('hashchange', async () => { readHash(); if (S.invite){ if (!S.me) await guestSignIn(); else { await checkInvite(); render(); } } });

/* ---------- rendering ---------- */
let renderWaiting=false;
function render(){
  const ae=document.activeElement;
  if (ae && app.contains(ae) && ae.tagName==='INPUT' && (ae.type==='text'||ae.type==='email')){ renderWaiting=true; return; }
  renderWaiting=false;
  if (!configured){ app.innerHTML=header()+'<div class="note warn">Add your Supabase anon key near the top of the page script to finish setup.</div>'; return; }
  if (S.phase==='boot'||S.phase==='loading'){ app.innerHTML=header()+'<p class="empty">Loading…</p>'; return; }
  let body;
  if (S.phase==='signedout') body=signedOutScreen();
  else if (S.screen==='cal' && S.cals[S.calId]) body=calScreen();
  else body=homeScreen();
  app.innerHTML = header() + notes() + body + footer();
}
function header(){
  let right='';
  if (S.phase==='ready') right = S.isAnon ? '<span class="pill">Guest</span>' : '<span class="pill host">'+esc(S.email||'Signed in')+'</span>';
  return '<header><div class="brand"><h1>Muster</h1><span>Find the night the whole party can make it</span></div>'+right+'</header>';
}
function notes(){
  let h='';
  if (S.sentTo) h+='<div class="note">Check <b>'+esc(S.sentTo)+'</b> for a sign-in link, then open it on this device. <button class="linkbtn" data-act="dismiss" data-k="_sent">OK</button></div>';
  for (const k in S.notes) h+='<div class="note warn">'+esc(S.notes[k])+' <button class="linkbtn" data-act="dismiss" data-k="'+k+'">Dismiss</button></div>';
  return h;
}
function emailForm(label){
  return '<div class="row"><label class="field" for="email">'+label+'<input type="email" id="email" autocomplete="email" inputmode="email" placeholder="you@example.com"></label></div>'
    +'<div><button class="btn primary" data-act="send"'+(S.busy?' disabled':'')+'>'+(S.busy?'Sending…':'Email me a sign-in link')+'</button></div>';
}
function signedOutScreen(){
  return '<div class="card list"><div><b>Running a game?</b><div class="meta">Sign in with your email to create calendars and invite your players. No password needed.</div></div>'+emailForm('Your email')+'</div>'
    +'<div class="card"><b>Playing in a game?</b><div class="meta">Open the invite link your DM sent you. You’ll only need to type your name.</div></div>';
}
function footer(){
  if (S.phase!=='ready') return '';
  if (S.isAnon){
    let h='<div class="card list"><div><b>Save your spot</b><div class="meta">Add your email to use Muster on another device, or to host a game of your own.</div></div>';
    h+= S.authOpen ? emailForm('Your email') : '<div><button class="btn small" data-act="authOpen">Add email</button></div>';
    return h+'</div>';
  }
  return '<div class="meta" style="text-align:center">Signed in as '+esc(S.email)+' · <button class="linkbtn" data-act="signout">Sign out</button></div>';
}
function inviteCard(){
  const iv=S.invite; if (!iv) return '';
  if (iv.state==='checking') return '<div class="note">Opening your invite…</div>';
  if (iv.state==='bad') return '<div class="note warn">That invite link doesn’t match a calendar. Ask your DM for a new link.</div>';
  const i=iv.info;
  return '<div class="card list"><div><b>'+esc(i.host_name||'Your DM')+' invited you to '+esc(i.name)+'.</b><div class="meta">Enter the name your group knows you by, then mark the days you can play.</div></div>'
    +'<div class="row"><label class="field" for="joinName">Your name<input type="text" id="joinName" maxlength="40" autocomplete="nickname" value="'+esc(myName())+'"></label></div>'
    +'<div><button class="btn primary" data-act="join"'+(S.busy?' disabled':'')+'>'+(S.busy?'Joining…':'Join calendar')+'</button></div></div>';
}
function calCard(id){
  const c=S.cals[id], n=membersOf(id).length, up=upcoming(id);
  let next='<span class="meta">No date meets the threshold yet.</span>';
  if (up.hit.length) next='<span class="star">★</span><span>Next: <b>'+fmtKey(up.hit[0][0])+'</b> ('+up.hit[0][1].y.length+' yes)</span>';
  else if (up.soft.length) next='<span class="star">☆</span><span>Closest: <b>'+fmtKey(up.soft[0][0])+'</b> if the maybes come</span>';
  return '<button class="card calcard" data-act="open" data-id="'+id+'"><span class="t">'+esc(c.name)+'</span>'
    +'<span class="meta">'+n+' '+(n===1?'player':'players')+' · needs '+c.threshold+' · '+up.hit.length+' ready, '+up.soft.length+' with maybes</span>'
    +'<span class="next">'+next+'</span></button>';
}
function homeScreen(){
  let h=inviteCard();
  const ids=sortCals(Object.keys(S.cals)); const hosted=ids.filter(isHostOf), joined=ids.filter(id=>!isHostOf(id));
  if (!S.isAnon){
    h+='<h2>Calendars you host</h2><div class="list">'+(hosted.length?hosted.map(calCard).join(''):'<div class="card empty">No calendars yet. Create one for each campaign below.</div>')+'</div>';
  }
  if (S.isAnon || joined.length){
    h+='<h2>Games you play in</h2><div class="list">'+(joined.length?joined.map(calCard).join(''):'<div class="card empty">You haven’t joined a game yet. Open the invite link your DM sent you.</div>')+'</div>';
  }
  if (!S.isAnon){
    h+='<h2>New calendar</h2><div class="card list"><div class="row">'
      +'<label class="field" for="newName">Campaign name<input type="text" id="newName" maxlength="80" placeholder="e.g. Thursday one-shots"></label>'
      +'<label class="field" style="flex:0 0 110px" for="newThr">Players needed<input type="number" id="newThr" min="1" max="40" value="5" inputmode="numeric"></label>'
      +'</div><div class="row"><label class="field" for="hostName">Your name in this game<input type="text" id="hostName" maxlength="40" value="'+esc(myName())+'"></label></div>'
      +'<div><button class="btn primary" data-act="create"'+(S.busy?' disabled':'')+'>Create calendar</button></div></div>';
  }
  return h;
}
function calScreen(){
  const id=S.calId, c=S.cals[id], members=membersOf(id), host=isHostOf(id);
  let h='<div class="topbar"><button class="btn small" data-act="home" aria-label="Back to calendars">‹ Back</button><h2>'+esc(c.name)+'</h2></div>';
  h+='<div class="meta">'+members.length+' '+(members.length===1?'player':'players')+' · highlighted when <b>'+c.threshold+'</b> say yes</div>';
  if (host){
    const link=here()+'#join-'+c.invite_code;
    h+='<details class="card settings"'+(S.settingsOpen?' open':'')+'><summary>Settings and invite</summary><div class="inner">'
      +'<div class="field">Invite link<div class="invite"><input id="inviteBox" readonly value="'+esc(link)+'"><button class="btn small" data-act="copy">Copy</button></div></div>'
      +'<div class="row"><span style="flex:1">Players needed</span><div class="stepper"><button data-act="thr" data-k="-1" aria-label="Fewer players">−</button><output>'+c.threshold+'</output><button data-act="thr" data-k="1" aria-label="More players">+</button></div></div>'
      +'<label class="field" for="rename">Calendar name<input type="text" id="rename" maxlength="80" value="'+esc(c.name)+'"></label>'
      +'<div class="field">Players<div class="members">'+members.map(u=>'<div class="member"><span>'+esc(nameOf(id,u))+(u===S.me?' (you)':'')+'</span>'+(u===S.me?'':'<button class="linkbtn" data-act="remove" data-u="'+esc(u)+'">'+(S.confirm==='rm-'+u?'Tap again to remove':'Remove')+'</button>')+'</div>').join('')+'</div></div>'
      +'<div><button class="btn danger small" data-act="del">'+(S.confirm==='del'?'Tap again to delete for everyone':'Delete calendar')+'</button></div>'
      +'</div></details>';
  }
  h+='<div class="legend"><span><i class="lh"></i>Threshold met</span><span><i class="ls"></i>Met if maybes come</span><span><i class="ly"></i>You: yes</span><span><i class="lm"></i>You: maybe</span></div>';
  const maxM=addMonth(THIS_MONTH,6), [yy,mm]=S.month.split('-').map(Number);
  h+='<div class="monthnav"><button data-act="month" data-k="-1" aria-label="Previous month"'+(S.month<=THIS_MONTH?' disabled':'')+'>‹</button><strong>'+MON[mm-1]+' '+yy+'</strong><button data-act="month" data-k="1" aria-label="Next month"'+(S.month>=maxM?' disabled':'')+'>›</button></div>';
  const days=monthDays(S.month), n=Math.max(members.length,1);
  h+='<div class="grid">'+DOW.map(d=>'<div class="dow">'+d[0]+'</div>').join('');
  for (let i=0;i<toDate(days[0]).getDay();i++) h+='<div></div>';
  for (const d of days){
    const past=d<TODAY;
    h+='<button class="cell'+(past?' past':'')+(d===TODAY?' today':'')+'" data-act="jump" data-date="'+d+'" aria-label="'+fmtDay(d)+'"'+(past?' disabled':'')+'><span class="n">'+(+d.slice(8))+'</span>';
    for (const [s] of SLOTS){ const t=tally(id,d+'|'+s), st=past?'':statusOf(id,t); h+='<span class="bar '+st+'" style="--f:'+Math.round(t.y.length/n*70)+'%"></span>'; }
    h+='</button>';
  }
  h+='</div><label class="toggle" for="onlyHits"><input type="checkbox" id="onlyHits"'+(S.onlyHits?' checked':'')+'> Only show days that meet the threshold</label><div class="list">';
  let shown=0;
  for (const d of days){
    if (d<TODAY) continue;
    const ts=SLOTS.map(([s])=>{ const k=d+'|'+s, t=tally(id,k); return {s,k,t,st:statusOf(id,t)}; });
    const best=ts.some(x=>x.st==='hit')?'hit':ts.some(x=>x.st==='soft')?'soft':'';
    if (S.onlyHits && !best) continue; shown++;
    const dd=toDate(d);
    h+='<div class="day '+best+'" id="d-'+d+'"><div class="dayhead"><span class="d">'+DOW[dd.getDay()]+'<small>'+MON[dd.getMonth()].slice(0,3)+' '+dd.getDate()+'</small></span>'
      +(best==='hit'?'<span class="badge">Threshold met</span>':best==='soft'?'<span class="badge soft">Met if maybes come</span>':'')
      +'<button class="linkbtn" data-act="who" data-date="'+d+'">'+(S.open[d]?'Hide':'Who’s in')+'</button></div><div class="slots">';
    for (const x of ts){
      const my=myStatus(id,x.k);
      h+='<button class="chip'+(my==='y'?' mine-y':my==='m'?' mine-m':'')+(x.st?' st-'+x.st:'')+'" data-act="cycle" data-key="'+x.k+'"'
        +' aria-label="'+SLOTNAME[x.s]+', your answer: '+(my==='y'?'yes':my==='m'?'maybe':'not marked')+'. Tap to change.">'
        +'<span class="s">'+SLOTNAME[x.s]+'</span><span class="c">'+x.t.y.length+' yes'+(x.t.m.length?' · '+x.t.m.length+' maybe':'')+'</span>'
        +'<span class="me">'+(my==='y'?'You: yes':my==='m'?'You: maybe':'')+'</span></button>';
    }
    h+='</div>';
    if (S.open[d]){
      h+='<div class="whopanel">';
      for (const x of ts){
        const none=members.filter(u=>!x.t.y.includes(u)&&!x.t.m.includes(u));
        h+='<div><b>'+SLOTNAME[x.s]+':</b> '+(x.t.y.length?'Yes: '+x.t.y.map(u=>esc(nameOf(id,u))).join(', '):'<span class="none">No yeses</span>')
          +(x.t.m.length?' · Maybe: '+x.t.m.map(u=>esc(nameOf(id,u))).join(', '):'')
          +(none.length?' <span class="none">· No answer: '+none.map(u=>esc(nameOf(id,u))).join(', ')+'</span>':'')+'</div>';
      }
      h+='</div>';
    }
    h+='</div>';
  }
  if (!shown) h+='<div class="card empty">'+(S.onlyHits?'No days this month meet the threshold yet.':'No days left this month. Use › to see next month.')+'</div>';
  h+='</div>';
  if (!host) h+='<div><button class="btn danger small" data-act="leave">'+(S.confirm==='leave'?'Tap again to leave this game':'Leave this game')+'</button></div>';
  return h;
}

/* ---------- boot ---------- */
(async function init(){
  readHash(); render();
  if (!configured) return;
  sb.auth.onAuthStateChange((event, session) => {
    if (event==='INITIAL_SESSION') return;
    setTimeout(()=>applySession(session),0);   // never await Supabase calls inside this callback
  });
  const { data } = await sb.auth.getSession();
  await applySession(data.session);
})();
</script>
</body>
</html>
